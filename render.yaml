# One service for prombot.net: the Dockerfile builds the site and serves it from
# the same uvicorn process that answers /api, so the browser makes no
# cross-origin request and there is no preflight before a generation.
#
# The ~1.1 GB index is not here and cannot be — it is served from
# huggingface.co/Jio7/prombot, which frontend/.env points at.
services:
  - type: web
    name: prombot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # The relays. Set both in the dashboard; sync:false keeps them out of git.
      - key: PROXY_URLS
        sync: false
      - key: PROXY_KEY
        sync: false
      # Presets. mysql://user:password@host:port/defaultdb — carries the
      # password, so dashboard-only like the rest.
      - key: DATABASE_URL
        sync: false
